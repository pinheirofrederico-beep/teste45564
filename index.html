<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo de Tiro 3D</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
  <script>
    // Cena, câmera e renderizador
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Chão
    const floorGeometry = new THREE.PlaneGeometry(100, 100);
    const floorMaterial = new THREE.MeshBasicMaterial({ color: 0x555555 });
    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // Alvo
    const targetGeometry = new THREE.BoxGeometry(2, 2, 2);
    const targetMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    const target = new THREE.Mesh(targetGeometry, targetMaterial);
    target.position.set(0, 1, -20);
    scene.add(target);

    // Posição inicial da câmera
    camera.position.set(0, 2, 5);

    // Controle de teclas
    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.key] = true);
    window.addEventListener('keyup', (e) => keys[e.key] = false);

    // Movimento do jogador
    const speed = 0.2;

    // Controle do mouse (Pointer Lock)
    document.body.addEventListener('click', () => {
      document.body.requestPointerLock();
    });

    let yaw = 0, pitch = 0;
    document.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement === document.body) {
        yaw -= e.movementX * 0.002;
        pitch -= e.movementY * 0.002;
        pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
        camera.rotation.set(pitch, yaw, 0);
      }
    });

    // Função de tiro
    function shoot() {
      const bulletGeometry = new THREE.SphereGeometry(0.2, 16, 16);
      const bulletMaterial = new THREE.MeshBasicMaterial({ color: 0xffff00 });
      const bullet = new THREE.Mesh(bulletGeometry, bulletMaterial);
      bullet.position.copy(camera.position);
      scene.add(bullet);

      const velocity = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).multiplyScalar(0.5);

      function animateBullet() {
        bullet.position.add(velocity);
        if (bullet.position.distanceTo(target.position) < 1.5) {
          target.material.color.set(0x00ff00); // muda cor ao acertar
          scene.remove(bullet);
          return;
        }
        requestAnimationFrame(animateBullet);
      }
      animateBullet();
    }

    window.addEventListener('click', shoot);

    // Loop de renderização
    function animate() {
      requestAnimationFrame(animate);

      // Movimento WASD
      const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
      const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));

      if (keys['w']) camera.position.add(forward.clone().multiplyScalar(speed));
      if (keys['s']) camera.position.add(forward.clone().multiplyScalar(-speed));
      if (keys['a']) camera.position.add(right.clone().multiplyScalar(-speed));
      if (keys['d']) camera.position.add(right.clone().multiplyScalar(speed));

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
