<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cidade 3D com Carro e M4</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<script>
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer();
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Chão
  const floorGeometry = new THREE.PlaneGeometry(500, 500);
  const floorMaterial = new THREE.MeshBasicMaterial({ color: 0x333333 });
  const floor = new THREE.Mesh(floorGeometry, floorMaterial);
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  // Casas
  function createHouse(x, z) {
    const walls = new THREE.BoxGeometry(10, 6, 10);
    const wallMaterial = new THREE.MeshBasicMaterial({ color: 0x888888 });
    const house = new THREE.Mesh(walls, wallMaterial);
    house.position.set(x, 3, z);

    const roof = new THREE.ConeGeometry(8, 4, 4);
    const roofMaterial = new THREE.MeshBasicMaterial({ color: 0x663300 });
    const roofMesh = new THREE.Mesh(roof, roofMaterial);
    roofMesh.position.set(x, 8, z);

    scene.add(house);
    scene.add(roofMesh);
  }
  for (let i = -100; i <= 100; i += 40) {
    createHouse(i, -50);
    createHouse(i, 50);
  }

  // Carro com rodas e volante
  const carBody = new THREE.BoxGeometry(6, 2, 3);
  const carMaterial = new THREE.MeshBasicMaterial({ color: 0x0000ff });
  const car = new THREE.Mesh(carBody, carMaterial);
  car.position.set(0, 1, 0);
  scene.add(car);

  // Rodas
  const wheelGeometry = new THREE.CylinderGeometry(0.7, 0.7, 0.5, 16);
  const wheelMaterial = new THREE.MeshBasicMaterial({ color: 0x111111 });
  const wheels = [];
  const wheelPositions = [[2.5,0.5,1.5],[2.5,0.5,-1.5],[-2.5,0.5,1.5],[-2.5,0.5,-1.5]];
  wheelPositions.forEach(pos=>{
    const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
    wheel.rotation.z = Math.PI/2;
    wheel.position.set(pos[0], pos[1], pos[2]);
    car.add(wheel);
    wheels.push(wheel);
  });

  // Volante
  const steeringGeometry = new THREE.TorusGeometry(0.5,0.1,16,100);
  const steeringMaterial = new THREE.MeshBasicMaterial({ color: 0x222222 });
  const steeringWheel = new THREE.Mesh(steeringGeometry, steeringMaterial);
  steeringWheel.position.set(0,1.5,1.2);
  car.add(steeringWheel);

  let drivingCar = false;

  // Arma M4 simplificada
  const gunGeometry = new THREE.BoxGeometry(1, 0.5, 3);
  const gunMaterial = new THREE.MeshBasicMaterial({ color: 0x222222 });
  const gun = new THREE.Mesh(gunGeometry, gunMaterial);
  gun.position.set(0.5, -0.5, -1.5);
  camera.add(gun);
  scene.add(camera);

  // Inimigos
  const enemies = [];
  function createEnemy(x, z) {
    const body = new THREE.BoxGeometry(1, 2, 1);
    const material = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    const enemy = new THREE.Mesh(body, material);
    enemy.position.set(x, 1, z);
    scene.add(enemy);
    enemies.push(enemy);
  }
  createEnemy(20, -20);
  createEnemy(-30, 40);
  createEnemy(50, -60);

  // Controles
  const keys = {};
  window.addEventListener('keydown', (e) => keys[e.key] = true);
  window.addEventListener('keyup', (e) => keys[e.key] = false);

  let yaw = 0, pitch = 0;
  document.body.addEventListener('click', () => document.body.requestPointerLock());
  document.addEventListener('mousemove', (e) => {
    if (document.pointerLockElement === document.body) {
      yaw -= e.movementX * 0.002;
      pitch -= e.movementY * 0.002;
      pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
      camera.rotation.set(pitch, yaw, 0);
    }
  });

  camera.position.set(0, 2, 10);

  // Tiro da M4
  function shoot() {
    const bulletGeometry = new THREE.SphereGeometry(0.1, 8, 8);
    const bulletMaterial = new THREE.MeshBasicMaterial({ color: 0xffff00 });
    const bullet = new THREE.Mesh(bulletGeometry, bulletMaterial);
    bullet.position.copy(camera.position);
    scene.add(bullet);

    const velocity = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).multiplyScalar(1);

    function animateBullet() {
      bullet.position.add(velocity);
      enemies.forEach((enemy, i) => {
        if (bullet.position.distanceTo(enemy.position) < 1.5) {
          scene.remove(enemy);
          enemies.splice(i, 1);
          scene.remove(bullet);
        }
      });
      requestAnimationFrame(animateBullet);
    }
    animateBullet();
  }

  window.addEventListener('mousedown', () => {
    const interval = setInterval(() => {
      if (!keys['mouseDown']) clearInterval(interval);
      shoot();
    }, 100);
    keys['mouseDown'] = true;
  });
  window.addEventListener('mouseup', () => keys['mouseDown'] = false);

  // Loop
  function animate() {
    requestAnimationFrame(animate);

    const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));

    if (drivingCar) {
      if (keys['w']) {
        car.position.add(forward.clone().multiplyScalar(0.5));
        wheels.forEach(w=>w.rotation.x -= 0.1); // roda gira
      }
      if (keys['s']) {
        car.position.add(forward.clone().multiplyScalar(-0.5));
        wheels.forEach(w=>w.rotation.x += 0.1);
      }
      if (keys['a']) {
        car.rotation.y += 0.05;
        steeringWheel.rotation.z += 0.05; // volante gira
      }
      if (keys['d']) {
        car.rotation.y -= 0.05;
        steeringWheel.rotation.z -= 0.05;
      }
      camera.position.copy(car.position).add(new THREE.Vector3(0, 3, 10));
      camera.lookAt(car.position);
    } else {
      if (keys['w']) camera.position.add(forward.clone().multiplyScalar(0.3));
      if (keys['s']) camera.position.add(forward.clone().multiplyScalar(-0.3));
      if (keys['a']) camera.position.add(right.clone().multiplyScalar(-0.3));
      if (keys['d']) camera.position.add(right.clone().multiplyScalar(0.3));
    }

    // Entrar no carro com "e"
    if (keys['e'] && camera.position.distanceTo(car.position) < 5) {
      drivingCar = true;
    }
    // Sair do carro com "q"
    if (keys['q']) {
      drivingCar = false;
    }

    renderer.render(scene, camera);
  }
  animate();
</script>
</body>
</html>
